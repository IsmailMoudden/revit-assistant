name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  addin:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build "Front-Revit AI/BimAiAssistant/BimAiAssistant.csproj" -c Release
      - name: Package Revit 2024 installer
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'RevitAssistant'
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item 'Front-Revit AI/BimAiAssistant/bin/Release/net48/BimAiAssistant.dll' $stage
          Copy-Item 'Front-Revit AI/BimAiAssistant/bin/Release/net48/Newtonsoft.Json.dll' $stage
          Copy-Item 'Front-Revit AI/BimAiAssistant/Installer/install.bat' $stage
          Copy-Item 'Front-Revit AI/BimAiAssistant/Installer/uninstall.bat' $stage
          Copy-Item 'Front-Revit AI/BimAiAssistant/Installer/README.txt' $stage
          Copy-Item 'LICENSE' $stage
          Compress-Archive -Path $stage -DestinationPath "$env:RUNNER_TEMP/RevitAssistant-Revit2024.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: revit-2024-addin
          path: ${{ runner.temp }}/RevitAssistant-Revit2024.zip
