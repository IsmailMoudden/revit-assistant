name: Checks
on: [push, pull_request, workflow_dispatch]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  addin:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        revit: ['2024', '2025', '2026']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Build and package Revit ${{ matrix.revit }}
        shell: pwsh
        run: ./scripts/package-addin.ps1 -RevitVersion '${{ matrix.revit }}' -OutputDirectory '${{ runner.temp }}'
      - uses: actions/upload-artifact@v4
        with:
          name: revit-${{ matrix.revit }}-addin
          path: ${{ runner.temp }}/RevitAssistant-Revit${{ matrix.revit }}.zip
  installer-checks:
    needs: addin
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: revit-*-addin
          merge-multiple: true
          path: ${{ runner.temp }}/packages
      - name: Verify isolated installation and removal
        shell: pwsh
        run: ./scripts/test-installers.ps1 -PackageDirectory '${{ runner.temp }}/packages'
